<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sblocca PRO | Calcolatore Forfettario</title>
  <link rel="stylesheet" href="style.css" />
    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N61X605S7R"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-N61X605S7R');
  </script>
  <link rel="canonical" href="https://forfettario-tool.pages.dev/unlock.html">
</head>
<body>
  <div id="cookieBanner" class="cookie-banner">
    <div class="cookie-content">
      <p>
        Questo sito utilizza cookie tecnici e strumenti di analisi (Google Analytics)
        per migliorare l'esperienza utente.
      </p>
      <div class="cookie-actions">
        <button id="acceptCookies" class="btn primary">Accetta</button>
        <button id="declineCookies" class="btn">Rifiuta</button>
      </div>
    </div>
  </div>
  <header class="wrap header">
    <div>
      <h1>Sblocca PRO</h1>
      <p class="sub">Incolla la tua chiave e sblocca PDF + scenari.</p>
    </div>
    <nav class="nav">
      <a href="index.html">Tool</a>
      <a href="pro.html">Acquista</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card">
      <label>
        Chiave PRO
        <input id="license" placeholder="es. GUMROAD-XXXX-XXXX" />
      </label>

      <div class="actions">
        <button id="btnUnlock" class="btn primary">Sblocca</button>
        <button id="btnLock" class="btn">Disattiva PRO</button>
      </div>

      <p id="msg" class="muted"></p>

      <p class="muted">
        (MVP) La chiave viene salvata nel browser. Per una verifica “vera” servirebbe un backend (step successivo).
      </p>
    </section>
  </main>

  <script>
  const KEY = "forfettario_pro_license";
  const msg = document.getElementById("msg");
  const input = document.getElementById("license");

  function setMessage(t){ msg.textContent = t; }

  function track(eventName, params = {}) {
    try {
      if (typeof gtag === "function") gtag("event", eventName, params);
    } catch (_) {}
  }

  document.getElementById("btnUnlock").addEventListener("click", () => {
    const v = (input.value || "").trim();
    if (v.length < 6) {
      setMessage("Inserisci una chiave valida.");
      track("pro_unlock_failed", { reason: "short_key" });
      return;
    }

    localStorage.setItem(KEY, v);
    localStorage.removeItem("forfettario_scenarios");
    setMessage("PRO attivata ✅ Reindirizzamento...");

    track("pro_unlocked", {
      event_category: "conversion",
      method: "license_key",
      key_length: v.length
    });

    setTimeout(() => {
      window.location.href = "index.html?unlocked=1";
    }, 600);
  });

  document.getElementById("btnLock").addEventListener("click", () => {
    localStorage.removeItem(KEY);
    setMessage("PRO disattivata.");

    track("pro_locked", { event_category: "engagement" });
  });

  const existing = localStorage.getItem(KEY);
  if (existing) {
    input.value = existing;
    setMessage("PRO già attiva su questo browser ✅");
  }
</script>
<script>
const cookieKey = "cookie_consent";

function enableAnalytics(){
  if (typeof gtag === "function") {
    gtag('consent', 'update', {
      'analytics_storage': 'granted'
    });
  }
}

function disableAnalytics(){
  if (typeof gtag === "function") {
    gtag('consent', 'update', {
      'analytics_storage': 'denied'
    });
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const banner = document.getElementById("cookieBanner");
  const consent = localStorage.getItem(cookieKey);

  if (!consent){
    banner.classList.add("show");
  } else if (consent === "accepted"){
    enableAnalytics();
  }

  document.getElementById("acceptCookies").onclick = () => {
    localStorage.setItem(cookieKey,"accepted");
    enableAnalytics();
    banner.remove();
  };

  document.getElementById("declineCookies").onclick = () => {
    localStorage.setItem(cookieKey,"declined");
    disableAnalytics();
    banner.remove();
  };
});
</script>
</body>
</html>
